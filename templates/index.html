<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farm Assistant - AI-Powered Crop Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 25%, #7e22ce 50%, #4c1d95 75%, #1e3c72 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        /* Animated particles background */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 60% 70%, white, transparent),
                radial-gradient(1px 1px at 50% 50%, white, transparent),
                radial-gradient(1px 1px at 80% 10%, white, transparent),
                radial-gradient(2px 2px at 90% 60%, white, transparent),
                radial-gradient(1px 1px at 33% 80%, white, transparent),
                radial-gradient(1px 1px at 15% 90%, white, transparent);
            background-size: 200% 200%;
            background-position: 0% 0%;
            animation: floatParticles 20s ease-in-out infinite;
            opacity: 0.4;
        }

        @keyframes floatParticles {

            0%,
            100% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(30px, -30px);
            }

            66% {
                transform: translate(-20px, 20px);
            }
        }

        .container {
            max-width: 650px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-radius: 35px;
            padding: 55px 45px;
            box-shadow:
                0 8px 32px 0 rgba(0, 0, 0, 0.37),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.18);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 45px;
        }

        .logo {
            font-size: 70px;
            margin-bottom: 15px;
            animation: bounce 2.5s ease-in-out infinite;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-15px) rotate(-5deg);
            }

            75% {
                transform: translateY(-8px) rotate(5deg);
            }
        }

        h1 {
            color: white;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 17px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: white;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        select,
        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 16px 22px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(10px);
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.3),
                0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        select option {
            background: #1e3c72;
            color: white;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input[type="file"] {
            cursor: pointer;
            padding: 14px;
            position: relative;
        }

        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.15));
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 15px;
            backdrop-filter: blur(10px);
        }

        input[type="file"]::file-selector-button:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.25));
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .preview-container {
            text-align: center;
            margin: 30px 0;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            padding: 20px;
            transition: all 0.3s ease;
        }

        .preview-container:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .preview-container img {
            max-width: 100%;
            max-height: 280px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            display: none;
            animation: zoomIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.8) rotate(-5deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .upload-placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            font-style: italic;
        }

        .btn-analyze {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ff6b9d 100%);
            background-size: 200% 200%;
            border: none;
            border-radius: 18px;
            color: white;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow:
                0 15px 35px rgba(245, 87, 108, 0.5),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-analyze::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s;
        }

        .btn-analyze:hover::before {
            left: 100%;
        }

        .btn-analyze:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                0 20px 45px rgba(245, 87, 108, 0.7),
                inset 0 -2px 0 rgba(0, 0, 0, 0.2);
            background-position: 100% 50%;
        }

        .btn-analyze:active {
            transform: translateY(-2px) scale(1.01);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 25px;
            color: white;
            font-weight: 600;
        }

        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 35px;
        }

        .feature {
            text-align: center;
            color: white;
            padding: 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
        }

        .feature:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        .feature-icon {
            font-size: 36px;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .feature-text {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .glass-card {
                padding: 35px 28px;
            }

            h1 {
                font-size: 28px;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script>
        function previewImage(event) {
            const img = document.getElementById("preview-img");
            const placeholder = document.querySelector(".upload-placeholder");

            if (event.target.files && event.target.files[0]) {
                img.src = URL.createObjectURL(event.target.files[0]);
                img.style.display = "block";
                if (placeholder) placeholder.style.display = "none";
            }
        }

        function showLoading() {
            document.getElementById("loading").style.display = "block";
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <div class="logo">🌱</div>
                <h1>Smart Farm Assistant</h1>
                <p class="subtitle">AI-Powered Crop Health Analysis</p>
            </div>

            <form method="POST" enctype="multipart/form-data" onsubmit="showLoading()">
                <div class="form-group">
                    <label>🌾 Select Crop Type</label>
                    <select name="crop" required>
                        <option value="tomato">🍅 Tomato</option>
                        <option value="banana">🍌 Banana</option>
                        <option value="chilli">🌶️ Chilli (Coming Soon)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📍 Your Location</label>
                    <input type="text" name="city" placeholder="Enter your city (e.g., Hyderabad)" value="Hyderabad"
                        required>
                </div>

                <div class="form-group">
                    <label>📸 Upload Crop Leaf Image</label>
                    <input type="file" name="image" accept="image/*" required onchange="previewImage(event)">
                </div>

                <div class="preview-container">
                    <img id="preview-img" alt="Preview">
                    <div class="upload-placeholder">Image preview will appear here</div>
                </div>

                <button type="submit" class="btn-analyze">
                    🔍 Analyze Crop Health
                </button>

                <div id="loading" class="loading">
                    <div class="loading-spinner"></div>
                    <p>Analyzing your crop... Please wait</p>
                </div>
            </form>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">🤖</div>
                    <div class="feature-text">AI Detection</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">☁️</div>
                    <div class="feature-text">Weather Insights</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📅</div>
                    <div class="feature-text">Smart Schedule</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
