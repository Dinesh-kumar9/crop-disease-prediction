# render.yaml — Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deploy with:
#   1. Push this file to your GitHub repo (root level)
#   2. Render Dashboard → New → Blueprint
#   3. Select your repo — Render auto-reads this file
#   4. Set secret env vars in Render dashboard

services:
  - type: web
    name: crop-disease-identification
    runtime: python
    region: singapore          # Closest to India
    plan: free

    # --- Build ---
    buildCommand: "pip install -r requirements.txt"

    # --- Start ---
    # --workers 1 --threads 4: keeps memory under 512MB while handling concurrent requests
    # --timeout 180: generous timeout for ML inference
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --access-logfile - --error-logfile -"

    # --- Environment Variables ---
    envVars:
      - key: FLASK_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true      # Render auto-generates a secure random key

      - key: LOG_LEVEL
        value: WARNING

      - key: CUDA_VISIBLE_DEVICES
        value: "-1"

      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"

      - key: OWM_API_KEY
        value: "5f84004690244978a3651a57c90e14f7"

    # --- Health Check ---
    healthCheckPath: /
